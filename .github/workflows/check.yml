name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  wake-helper:
    uses: ./.github/workflows/boxci-wake.yml
    with:
      pool: "[]"
      runner-label: boxci-test
  wake-helper-output:
    needs: wake-helper
    runs-on: ubuntu-24.04
    steps:
      - name: Verify secret-free hosted fallback through workflow output
        env:
          ROUTE: ${{ needs.wake-helper.outputs.runner }}
        run: python3 -c 'import json,os; assert json.loads(os.environ["ROUTE"]) == ["ubuntu-24.04"]'
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: ["22.19.0", "22", "24.5.0", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: python3 -m unittest discover -s ci/tests
      - run: npm pack --dry-run
  dashboard-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/dashboard-manager.test.js tests/dashboard.test.js
